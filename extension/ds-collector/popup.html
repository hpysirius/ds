<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #6b7280;
        --line: #e5e7eb;
        --primary: #2563eb;
        --ok: #16a34a;
        --warn: #d97706;
        --err: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      .wrap { padding: 12px 14px 14px; }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .sub { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
      .row { display: flex; gap: 6px; margin-bottom: 8px; }
      input[type="text"], input[type="number"] {
        flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line);
        border-radius: 6px; font-size: 12px; outline: none;
      }
      input:focus { border-color: var(--primary); }
      button {
        padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
        background: #fff; cursor: pointer; font-size: 12px; white-space: nowrap;
      }
      button:hover { background: #f3f4f6; }
      button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
      button.primary:hover { background: #1d4ed8; }
      button.danger { color: var(--err); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .status {
        border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
        font-size: 11px; color: var(--muted); background: #fafafa; margin-bottom: 8px;
      }
      .status b { color: var(--fg); }
      .progress { height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 8px; }
      .progress > i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .3s; }
      .logs {
        max-height: 190px; overflow: auto; border: 1px solid var(--line); border-radius: 6px;
        padding: 6px 8px; font-size: 11px; background: #fafafa;
      }
      .logs div { padding: 2px 0; border-bottom: 1px dashed #eee; word-break: break-all; }
      .logs div:last-child { border-bottom: 0; }
      .hint { color: var(--muted); font-size: 11px; margin-top: 8px; }
      .dot { display: inline-block; width: 7px; height: 7px; border-radius: 99px; background: var(--muted); margin-right: 5px; }
      .dot.on { background: var(--ok); }
      .dot.off { background: var(--err); }
      .sep {
        margin: 12px 0 8px; padding-top: 10px; border-top: 1px solid var(--line);
        font-size: 12px; font-weight: 600; color: var(--fg);
      }
      select.sel {
        flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line);
        border-radius: 6px; font-size: 12px; background: #fff; outline: none;
      }
      .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
      .grid label { font-size: 11px; color: var(--muted); display: block; }
      .grid input {
        width: 100%; min-width: 0; padding: 5px 6px; border: 1px solid var(--line);
        border-radius: 6px; font-size: 12px; outline: none; margin-top: 2px;
      }
      .grid input:focus { border-color: var(--primary); }
      .ck { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
      .ck input { margin: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>DS Ozon 采集助手</h1>
      <div class="sub">跑在<b>正常浏览器</b>里采集，不走调试模式 · 不受反爬挑战</div>

      <div class="row">
        <input id="api" type="text" placeholder="后端地址 http://localhost:3101 或 http://ozon.qinxianty.com/api" />
        <button id="saveApi">保存</button>
      </div>

      <div class="row" style="margin-top:-2px">
        <button id="useLocal" style="flex:1">填本地</button>
        <button id="useServer" style="flex:1">填服务器</button>
      </div>

      <div class="row">
        <button id="rules" style="flex:1">🏷 采集规则（自动打标签）</button>
      </div>

      <div class="status">
        <div><span id="dot" class="dot"></span><span id="apiState">检测中…</span></div>
        <div style="margin-top:4px">待补商品：<b id="remaining">-</b></div>
        <div style="margin-top:4px">采集归属：<b id="identity">-</b></div>
      </div>

      <div class="row">
        <button id="collect" style="flex:1">采集当前商品页</button>
      </div>

      <label class="ck" style="margin-bottom:6px" title="开：采集时只保留命中规则的商品，未命中的直接丢弃、不入库；关：全部采集入库，仅给命中的商品打标签">
        <input id="filterMode" type="checkbox" /> 过滤模式（只采集命中规则的商品）
      </label>

      <div class="row">
        <button id="collectList" class="primary" style="flex:1">采集当前列表页</button>
        <input id="scrolls" type="number" value="3" min="0" max="30" title="往下滚几屏（每屏约 36 个商品）" style="max-width:56px" />
      </div>

      <div class="row">
        <input id="limit" type="number" value="20" min="1" max="200" style="max-width:74px" />
        <button id="batch" style="flex:1">补详情(批量)</button>
        <button id="stop" class="danger">停止</button>
      </div>

      <div class="progress"><i id="bar"></i></div>

      <div class="logs" id="logs"><div>（暂无日志）</div></div>

      <div class="hint">
        <b>采集当前列表页</b>：在 highlight/搜索/类目页上用，抓整页商品并往下滚几屏（右侧数字），新商品自动入库<br />
        <b>补详情(批量)</b>：给库里缺类目/主图/价格的商品逐条补详情页信息
      </div>

      <div class="sep">1688 回填核价页</div>

      <div class="row">
        <input id="target" type="text" placeholder="核价页地址 http://ozon.qinxianty.com/pricing?sku=xxx" />
      </div>

      <div class="row">
        <button id="grab1688" class="primary" style="flex:1">抓当前 1688 页</button>
      </div>

      <div class="row">
        <select id="skuSel" class="sel"><option value="">（先点上面的抓取）</option></select>
      </div>

      <div class="grid">
        <label>成本 ¥<input id="fCost" type="number" step="0.01" /></label>
        <label>重量 kg<input id="fWt" type="number" step="0.001" /></label>
        <label>长 cm<input id="fL" type="number" step="0.1" /></label>
        <label>宽 cm<input id="fW" type="number" step="0.1" /></label>
        <label>高 cm<input id="fH" type="number" step="0.1" /></label>
        <label>运费 ¥<input id="fFr" type="number" step="0.1" /></label>
      </div>

      <div class="row" style="margin-top:6px">
        <label class="ck"><input id="addFreight" type="checkbox" checked /> 成本里加上另需运费</label>
      </div>

      <div class="row">
        <button id="fillBtn" class="primary" style="flex:1">回填到核价页</button>
      </div>

      <div class="status" id="fillInfo" style="display:none"></div>

      <div class="hint">
        在 <b>1688 货品页</b>点「抓当前 1688 页」，选规格后可微调数值，再点「回填到核价页」——
        会自动打开/刷新你填的地址，并把成本、重量、长宽高填进表单。
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
